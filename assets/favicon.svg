<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- The 28 from the MIM28 wordmark. The full logo is a monoline "MIM28"
       that turns to mush at 16px, so only the cohort number is kept, drawn
       solid rather than monoline for the same reason. -->
  <rect width="64" height="64" rx="14" fill="#2f6d54"/>
  <text x="32" y="45.5" text-anchor="middle"
        font-family="Archivo, Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="36" font-weight="800" letter-spacing="-1.5"
        fill="#f2f7f4">28</text>
</svg>
